name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app builds and runs
        run: python main.py

  test:
    name: 2. Automated Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run unit tests with coverage
        run: pytest --cov=student_mgmt --cov-report=term-missing --cov-fail-under=80

  quality:
    name: 3. Code Quality Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint with flake8
        run: flake8 .

  deploy:
    name: 4. Deployment
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Package application
        run: |
          mkdir dist
          zip -r dist/student-app.zip student_mgmt main.py requirements.txt
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: student-app
          path: dist/student-app.zip
      - name: Deploy (simulated production deploy)
        run: echo "Deployed student-app.zip to production"
